name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare project
        run: |
          mkdir -p www
          cp index.html www/index.html
          echo '{"name":"nooryaqeen","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.2.0","@capacitor/cli":"^6.2.0","@capacitor/core":"^6.2.0","@capacitor/geolocation":"^6.0.0","@capacitor/local-notifications":"^6.1.0"}}' > package.json
          echo '{"appId":"com.nooryaqeen.app","appName":"نور اليقين","webDir":"www"}' > capacitor.config.json
      - run: npm install
      - run: npx cap add android
      - name: Add permissions
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><application|' android/app/src/main/AndroidManifest.xml
      - name: Add adhan sound (optional)
        run: |
          if [ -f adhan.mp3 ]; then
            mkdir -p android/app/src/main/res/raw
            cp adhan.mp3 android/app/src/main/res/raw/adhan.mp3
            sed -i 's|<head>|<head><script>window.NATIVE_ADHAN=1</script>|' www/index.html
          fi
      - run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nooryaqeen-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Noor Al-Yaqin ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          
